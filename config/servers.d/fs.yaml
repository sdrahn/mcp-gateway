# Example backend: a filesystem MCP server confined to the principal's home.
name: fs
command: ["/usr/libexec/mcp-servers/mcp-fs", "--root", "${HOME}"]
selinux_type: mcpsrv_fs_t
isolation: principal
network: false
run_as: principal
env:
  LOG_LEVEL: info
sandbox:
  protect_home: read-write
# Secrets for the server, handed over by systemd (LoadCredential=) and read
# by the server from $CREDENTIALS_DIRECTORY/<name>. "name" reads
# /etc/mcp-gateway/credentials/<name> (root only); "name:/path" reads /path.
# The gateway itself never reads them.
# credentials: [github-token]
