# mcp-gateway main configuration (installed as /etc/mcp-gateway/gateway.yaml).
# All values shown are the defaults, except socket_group (default: empty).

# Unix socket for local clients (directly or via mcp-connect).
socket: /run/mcp-gateway/mcp.sock
# Group owning the socket (mode 0660). Empty: the gateway's own group.
socket_group: mcp-users

# Backend definitions, one *.yaml per MCP server.
servers_dir: /etc/mcp-gateway/servers.d

# Grants store and other state.
state_dir: /var/lib/mcp-gateway

policy:
  # OPA sidecar (mcp-opa.service).
  opa_socket: /run/mcp-gateway/opa.sock
  # Decisions not received within this time are denied.
  timeout: 250ms

# How long a call waits for a human approval before it is denied.
approval_timeout: 120s

supervisor:
  # systemd: each backend instance is a confined transient unit.
  # exec: plain child processes without confinement (development only).
  mode: systemd
  # auto: set SELinuxContext= (backend type + per-instance MCS pair) when
  # SELinux is enabled. on / off force it.
  selinux: auto
  # Stop an instance this long after the last session using it ended.
  idle_timeout: 15m

# Remote access via MCP Streamable HTTP with OAuth bearer tokens.
# Disabled unless listen is set. Endpoints: /mcp (aggregated) and
# /mcp/<server>; metadata at /.well-known/oauth-protected-resource.
# http:
#   listen: ":8443"
#   cert_file: /etc/mcp-gateway/tls/cert.pem
#   key_file: /etc/mcp-gateway/tls/key.pem
#   # Token validation: issuer, and audience = this gateway's public MCP URL.
#   issuer: https://idp.example.com/realms/mcp
#   audience: https://gateway.example.com:8443/mcp
#   # Default: found via <issuer>/.well-known/openid-configuration.
#   jwks_url: ""
#   groups_claim: groups
#   # Map remote users to local accounts by this claim (decision D1);
#   # unmapped principals run backends as a dynamic user.
#   local_user_claim: preferred_username
#   scopes: []
#   # Origins accepted from browser-based clients.
#   allowed_origins: []
#   session_idle_timeout: 30m
