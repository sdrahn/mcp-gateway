# mcp-gateway main configuration.
#
# Packages install this file as /usr/etc/mcp-gateway/gateway.yaml (or
# /etc/mcp-gateway/gateway.yaml on distributions without /usr/etc). To
# change settings, copy it to /etc/mcp-gateway/gateway.yaml and edit the
# copy: the gateway reads /etc first, then /usr/etc, else its built-in
# defaults. All values shown are the defaults, except socket_group
# (default: empty).

# Unix socket for local clients (directly or via mcp-connect).
socket: /run/mcp-gateway/mcp.sock
# Group owning the socket (mode 0660). Empty: the gateway's own group.
socket_group: mcp-users

# Backend definitions, one *.yaml per MCP server: packages install theirs
# to vendor_servers_dir; files in servers_dir override those of the same
# name, and an empty file (or a symlink to /dev/null) disables one.
vendor_servers_dir: /usr/share/mcp-gateway/servers.d
servers_dir: /etc/mcp-gateway/servers.d

# Grants store and other state.
state_dir: /var/lib/mcp-gateway

policy:
  # OPA sidecar (mcp-opa.service).
  opa_socket: /run/mcp-gateway/opa.sock
  # Decisions not received within this time are denied.
  timeout: 250ms
  # How often to check whether OPA loaded a changed policy; clients are
  # then told to list tools, prompts and resources again.
  watch_interval: 10s

# How long a call waits for a human approval before it is denied.
approval_timeout: 120s

approvals:
  # Control API for the approvals inbox and grants (the Cockpit page talks
  # to it as the logged-in user). "-" disables it, and with it the url and
  # oob approval channels.
  control_socket: /run/mcp-gateway/control.sock
  # Approval page for URL-mode elicitations; {id} is the approval id.
  # Empty disables the url channel. With the Cockpit page, e.g.:
  #   https://gateway.example.com:9090/mcp-gateway#/approvals/{id}
  url_template: ""
  # Who may decide on approvals and revoke grants is policy: "approvers"
  # in /etc/mcp-gateway/policy/rbac/data.json (default: the principal
  # themself and the admin role).

audit:
  # Denials, approval decisions, grant revocations and policy changes also
  # go to the kernel audit subsystem (ausearch -m TRUSTED_APP), next to
  # SELinux AVC records. auto: if possible (needs CAP_AUDIT_WRITE);
  # on: refuse to start otherwise; off.
  kernel: auto

supervisor:
  # systemd: each backend instance is a confined transient unit.
  # exec: plain child processes without confinement (development only).
  mode: systemd
  # auto: set SELinuxContext= (backend type + per-instance MCS pair) when
  # SELinux is enabled. on / off force it.
  selinux: auto
  # Stop an instance this long after the last session using it ended.
  idle_timeout: 15m
  # MCS categories for the instances' pairs. libvirt picks its pairs from
  # its daemon's range: confine it to the rest with a drop-in from
  # /usr/share/mcp-gateway/mcs (the gateway warns while they overlap).
  mcs_range: c768.c1023
  # auto: skip pairs held by running containers (podman cannot be
  # confined to a range) and virtual machines, and replace an instance
  # whose pair a container or machine started later takes. off.
  mcs_avoid: auto

# Remote access via MCP Streamable HTTP with OAuth bearer tokens.
# Disabled unless listen is set. Endpoints: /mcp (aggregated) and
# /mcp/<server>; metadata at /.well-known/oauth-protected-resource.
# http:
#   listen: ":8443"
#   cert_file: /etc/mcp-gateway/tls/cert.pem
#   key_file: /etc/mcp-gateway/tls/key.pem
#   # Token validation: issuer, and audience = this gateway's public MCP URL.
#   issuer: https://idp.example.com/realms/mcp
#   audience: https://gateway.example.com:8443/mcp
#   # Default: found via <issuer>/.well-known/openid-configuration.
#   jwks_url: ""
#   groups_claim: groups
#   # Map remote users to local accounts by this claim (decision D1);
#   # unmapped principals run backends as a dynamic user.
#   local_user_claim: preferred_username
#   scopes: []
#   # Origins accepted from browser-based clients.
#   allowed_origins: []
#   session_idle_timeout: 30m
#   # mTLS: verify client certificates against these CAs. client_auth:
#   # optional (verify if presented; default with a CA file) or required.
#   # Certificate-bound tokens (cnf/x5t#S256, RFC 8705) are then accepted
#   # only with their certificate; require_bound_tokens refuses others.
#   # Policy sees the certificate as input.principal.cert.
#   client_ca_file: /etc/mcp-gateway/tls/client-ca.pem
#   client_auth: optional
#   require_bound_tokens: false
