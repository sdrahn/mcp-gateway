# The gateway's own account. Its token (a projected volume, not the
# default mount) only reads the cluster's issuer discovery document and
# key set, which every ServiceAccount may (the cluster's default binding
# system:service-account-issuer-discovery); step 47 adds the rights to
# start pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-gateway
  namespace: mcp-gateway
automountServiceAccountToken: false
