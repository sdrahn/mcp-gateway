# The gateway reads the Services of mcp-servers (server_discovery), and
# nothing else there.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-gateway-discovery
  namespace: mcp-servers
rules:
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-gateway-discovery
  namespace: mcp-servers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-gateway-discovery
subjects:
  - kind: ServiceAccount
    name: mcp-gateway
    namespace: mcp-gateway
