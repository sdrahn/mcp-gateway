{{- $name := include "mcp-gateway.fullname" . -}}
{{- $image := include "mcp-gateway.image" . -}}
# One replica (docs/architecture.md, section 5.12.5), Recreate as its
# volume is ReadWriteOnce: the gateway, OPA and mcp-policy-render in one
# pod, the policy copied from the gateway's image by the init container.
# As deploy/kubernetes/deployment.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "mcp-gateway.labels" . | nindent 4 }}
spec:
  {{- $replicas := int .Values.replication.replicas }}
  {{- if gt $replicas 1 }}
  {{- if or (not .Values.replication.enabled) .Values.persistence.enabled (not .Values.replication.peerSecret) }}
  {{- fail "replication.replicas > 1 needs replication.enabled, persistence.enabled false and replication.peerSecret" }}
  {{- end }}
  {{- end }}
  replicas: {{ $replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "mcp-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "mcp-gateway.selectorLabels" . | nindent 8 }}
      annotations:
        # gateway.yaml has keys that need a restart: a change rolls the pod.
        checksum/config: {{ include "mcp-gateway.config" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      {{- if .Values.replication.peerSecret }}
      # A replica drains for replication.drain_timeout (30 s) before it
      # stops: 15 s more for the stop itself.
      terminationGracePeriodSeconds: 45
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: policy
          image: {{ $image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/bin/cp", "-R", "/usr/share/mcp-gateway/policy/.", "/policy/"]
          securityContext: {{- include "mcp-gateway.restricted" . | nindent 12 }}
          volumeMounts:
            - {name: policy, mountPath: /policy}
      containers:
        - name: gateway
          image: {{ $image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/mcp-gateway/config/gateway.yaml"]
          # The replica's name and address (replication; several
          # replicas: docs/architecture.md, section 5.12.5).
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
          ports:
            - {name: https, containerPort: 8443}
            - {name: metrics, containerPort: 9464}
            {{- if .Values.replication.peerSecret }}
            # The peer listener: the other replicas only (mTLS).
            - {name: peer, containerPort: 8444}
            {{- end }}
          # /readyz: the policy engine answers; /healthz: the gateway
          # serves (metrics.listen).
          readinessProbe:
            httpGet: {path: /readyz, port: metrics}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources: {{- toYaml .Values.resources.gateway | nindent 12 }}
          securityContext: {{- include "mcp-gateway.restricted" . | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/mcp-gateway/config, readOnly: true}
            - {name: servers, mountPath: /etc/mcp-gateway/servers.d, readOnly: true}
            - {name: rbac, mountPath: /etc/mcp-gateway/policy/rbac, readOnly: true}
            - {name: tls, mountPath: /etc/mcp-gateway/tls, readOnly: true}
            {{- range $i, $s := .Values.secrets }}
            - {name: secret-{{ $i }}, mountPath: {{ default (printf "/etc/mcp-gateway/secrets/%s" $s.name) $s.mountPath }}, readOnly: true}
            {{- end }}
            {{- if or .Values.clusterIssuer.enabled .Values.replication.enabled }}
            - {name: cluster-ca, mountPath: /etc/mcp-gateway/cluster-ca, readOnly: true}
            - {name: token, mountPath: /var/run/secrets/mcp-gateway/token, readOnly: true}
            {{- end }}
            - {name: state, mountPath: /var/lib/mcp-gateway}
            {{- if .Values.replication.peerSecret }}
            - {name: peer, mountPath: /etc/mcp-gateway/peer, readOnly: true}
            {{- end }}
            - {name: run, mountPath: /run/mcp-gateway}
            - {name: rendered, mountPath: /run/mcp-opa, readOnly: true}
            - {name: tmp, mountPath: /tmp}
        - name: policy-render
          image: {{ $image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/libexec/mcp-gateway/mcp-policy-render", "-watch"]
          resources: {{- toYaml .Values.resources.policyRender | nindent 12 }}
          securityContext: {{- include "mcp-gateway.restricted" . | nindent 12 }}
          volumeMounts:
            - {name: rbac, mountPath: /etc/mcp-gateway/policy/rbac, readOnly: true}
            - {name: rendered, mountPath: /run/mcp-opa}
        - name: opa
          image: {{ printf "%s:%s" .Values.opaImage.repository .Values.opaImage.tag }}
          imagePullPolicy: {{ .Values.opaImage.pullPolicy }}
          args:
            - run
            - --server
            - --addr=unix:///run/mcp-gateway/opa.sock
            - --unix-socket-perm=0660
            - --watch
            - --log-format=json
            - --set=decision_logs.console=true
            - --set=decision_logs.mask_decision=/mcp/log/mask
            - /policy
            - mcp.rbac:/run/mcp-opa/rbac
          resources: {{- toYaml .Values.resources.opa | nindent 12 }}
          securityContext: {{- include "mcp-gateway.restricted" . | nindent 12 }}
          volumeMounts:
            - {name: policy, mountPath: /policy, readOnly: true}
            - {name: rendered, mountPath: /run/mcp-opa, readOnly: true}
            - {name: run, mountPath: /run/mcp-gateway}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap: {name: {{ $name }}-config}
        - name: servers
          configMap: {name: {{ $name }}-servers}
        - name: rbac
          configMap: {name: {{ $name }}-rbac}
        - name: tls
          secret: {secretName: {{ .Values.tls.secretName }}}
        {{- range $i, $s := .Values.secrets }}
        # The gateway's account reads it (fsGroup), no other.
        - name: secret-{{ $i }}
          secret: {secretName: {{ required "secrets[].name: the Secret's name" $s.name }}, defaultMode: 0440}
        {{- end }}
        {{- if or .Values.clusterIssuer.enabled .Values.replication.enabled }}
        - name: cluster-ca
          configMap: {name: kube-root-ca.crt}
        # The gateway's own token, for the cluster's issuer key set and the
        # shared store: for the API server, an hour long, renewed by the
        # kubelet.
        - name: token
          projected:
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 3600}
        {{- end }}
        - name: state
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-state" $name) .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.replication.peerSecret }}
        - name: peer
          secret: {secretName: {{ .Values.replication.peerSecret }}, defaultMode: 0440}
        {{- end }}
        - name: run
          emptyDir: {medium: Memory}
        - name: rendered
          emptyDir: {medium: Memory}
        - name: policy
          emptyDir: {}
        - name: tmp
          emptyDir: {}
