{{- range .Values.serverDiscovery.namespaces }}
# Servers discovered in {{ .namespace }} (server_discovery): the gateway's
# ServiceAccount may read the namespace's Services, and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mcp-gateway.fullname" $ }}-discovery
  namespace: {{ .namespace }}
  labels: {{- include "mcp-gateway.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mcp-gateway.fullname" $ }}-discovery
  namespace: {{ .namespace }}
  labels: {{- include "mcp-gateway.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mcp-gateway.fullname" $ }}-discovery
subjects:
  - kind: ServiceAccount
    name: {{ include "mcp-gateway.fullname" $ }}
    namespace: {{ $.Release.Namespace }}
---
{{- end }}
