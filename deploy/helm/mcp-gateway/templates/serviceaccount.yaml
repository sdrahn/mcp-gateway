# The gateway's own account. Its token (a projected volume, not the
# default mount) only reads the cluster's issuer discovery document and
# key set, which every ServiceAccount may.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mcp-gateway.fullname" . }}
  labels: {{- include "mcp-gateway.labels" . | nindent 4 }}
automountServiceAccountToken: false
