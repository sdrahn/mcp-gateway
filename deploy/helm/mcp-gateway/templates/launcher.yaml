{{- if .Values.kubernetesLauncher.enabled }}
{{- $kl := .Values.kubernetesLauncher }}
{{- if $kl.createNamespace }}
# The instances' pods: a namespace of their own, held to the restricted
# Pod Security Standard, which the pods the gateway creates meet.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $kl.namespace }}
  labels:
    {{- include "mcp-gateway.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
{{- end }}
# What the gateway's ServiceAccount may do in the instances' namespace,
# and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-instances
  namespace: {{ $kl.namespace }}
  labels: {{- include "mcp-gateway.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, delete, deletecollection]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-instances
  namespace: {{ $kl.namespace }}
  labels: {{- include "mcp-gateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mcp-gateway.fullname" . }}-instances
subjects:
  - kind: ServiceAccount
    name: {{ include "mcp-gateway.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
