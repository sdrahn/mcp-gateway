{{- if .Values.replication.enabled }}
# The shared store: what the gateway's ServiceAccount may do with the
# Secrets of its own namespace, where it keeps its records, and the
# Leases the replicas hold.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-state
  labels: {{- include "mcp-gateway.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mcp-gateway.fullname" . }}-state
  labels: {{- include "mcp-gateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mcp-gateway.fullname" . }}-state
subjects:
  - kind: ServiceAccount
    name: {{ include "mcp-gateway.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
