{{- if .Values.ingress.enabled }}
# The listener serves TLS itself: the ingress controller passes TLS
# through or re-encrypts (its annotations, e.g. for ingress-nginx
# nginx.ingress.kubernetes.io/backend-protocol: HTTPS).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mcp-gateway.fullname" . }}
  labels: {{- include "mcp-gateway.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "mcp-gateway.fullname" . }}
                port:
                  name: https
{{- end }}
