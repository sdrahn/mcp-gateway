# Values of the mcp-gateway chart (user guide, chapter 16). The gateway's
# own settings are gateway.yaml's (chapter 3), under config; server
# definitions (chapter 4) under servers; the role data (chapter 6) under
# rbac.

image:
  repository: registry.example.com/mcp-gateway
  # Default: the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
opaImage:
  repository: docker.io/openpolicyagent/opa
  tag: 1.22.4-static
  pullPolicy: IfNotPresent
imagePullSecrets: []

# gateway.yaml. The chart sets what the pod's layout fixes (deployment,
# the directories, the sockets, the listener's address and certificate,
# the cluster issuer's CA and token); put the rest here.
config:
  http:
    # The organization's identity provider: people sign in with it.
    issuer: https://idp.example.com/realms/mcp
    # The URL agents use, ending in /mcp.
    audience: https://mcp-gateway.example.com/mcp
    scopes: [mcp]

# The cluster's ServiceAccount tokens, for agents in the cluster: added to
# http.issuers. The pod's own token reads the issuer's key set.
clusterIssuer:
  enabled: true
  issuer: https://kubernetes.default.svc.cluster.local
  # The audience the agents' projected tokens ask for.
  audience: mcp-gateway
  subjectPrefix: "k8s:"

# Stdio servers in pods of their own (supervisor.mode: kubernetes, user
# guide chapter 16): the instances' namespace, the gateway's rights there
# (a Role), and the launcher's settings. Off: stdio servers are refused,
# servers that speak HTTP are served.
kubernetesLauncher:
  enabled: true
  namespace: mcp-instances
  # Create the namespace, held to the restricted Pod Security Standard.
  createNamespace: true
  imagePullPolicy: IfNotPresent
  startTimeout: 2m
  # on: an MCS level per instance, for nodes that run SELinux.
  selinux: "off"

# Server definitions, by file name: name, url, ... (chapter 4); a stdio
# server names its image.
servers: {}
#  tickets:
#    name: tickets
#    url: http://tickets.mcp-servers.svc:8080/mcp

# The role data, data.yaml (chapter 6); empty: the shipped default.
rbac: {}

# Secrets for the files gateway.yaml and the server definitions name:
# each Secret is mounted read-only into the gateway's container, at
# /etc/mcp-gateway/secrets/<name>/<key> or at mountPath, readable by the
# gateway's account only (0440, group 10001). The gateway reads them as
# files on a host: the approval page's client secret
# (approvals.page.client_secret_file), webhooks' secrets
# (approvals.webhooks[].secret_file), the mail password
# (notifications.email.password_file), and the servers' credentials (a Secret at
# /etc/mcp-gateway/credentials, for credentials: [name]). Most are read
# at start: after changing a Secret, restart the gateway
# (kubectl rollout restart deployment/mcp-gateway).
secrets: []
#  - name: mcp-gateway-console
#    # approvals.page.client_secret_file:
#    #   /etc/mcp-gateway/secrets/mcp-gateway-console/client-secret
#  - name: mcp-gateway-credentials
#    mountPath: /etc/mcp-gateway/credentials

# The listener's certificate: a Secret of type kubernetes.io/tls.
tls:
  secretName: mcp-gateway-tls

persistence:
  size: 1Gi
  storageClassName: ""
  # An existing claim instead of a new one.
  existingClaim: ""

service:
  type: ClusterIP
  port: 443

# A Prometheus Operator ServiceMonitor for the metrics port (needs its
# CRD).
serviceMonitor:
  enabled: false
  interval: 30s

ingress:
  enabled: false
  className: ""
  annotations: {}
  # The listener serves TLS itself: pass it through, or re-encrypt.
  host: mcp-gateway.example.com
  tls: []

resources:
  gateway:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 1Gi}
  policyRender:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
  opa:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 512Mi}

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
