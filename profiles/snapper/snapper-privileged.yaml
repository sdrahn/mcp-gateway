# mcp-server-snapper as a privileged server: as root, snapperd also lets
# it change configs (set_config), and rollback, which runs snapper
# rollback, can set the default subvolume. Every call but the reading
# ones and create_snapshot is approved (role snapper-operator). Enable it
# by linking it as /etc/mcp-gateway/servers.d/snapper.yaml (privileged
# servers are accepted only there); see chapter 13 of the user guide.
version: 1
name: snapper
command: ["/usr/bin/mcp-server-snapper"]
run_as: root
selinux_type: mcpsrv_snapper_t
privileged: true
