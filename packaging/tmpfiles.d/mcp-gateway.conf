# The gateway's runtime directory, shared by mcp-gateway.service (mcp.sock,
# control.sock) and mcp-opa.service (opa.sock). Not a RuntimeDirectory= of
# either unit: systemd would chown it, sockets included, to whichever unit
# started last. Group-writable for both daemons; others may only traverse
# it to reach mcp.sock, which is itself restricted to socket_group.
d /run/mcp-gateway 0771 mcp-gateway mcp-gateway -
# Access tokens of instances of servers with sign_in, until systemd has
# read them (LoadCredential=): the gateway only.
d /run/mcp-gateway/credentials 0700 mcp-gateway mcp-gateway -
# The role data as OPA loads it, written by mcp-policy-render.service
# (root): readable by all, writable by neither the gateway nor OPA. Not
# below /run/mcp-gateway, which the gateway's account owns.
d /run/mcp-opa 0755 root root -
d /run/mcp-opa/rbac 0755 root root -
