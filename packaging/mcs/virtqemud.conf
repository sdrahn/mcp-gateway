# Drop-in for virtqemud.service (modular libvirt QEMU daemon): keep libvirt's sVirt
# category pairs out of mcp-gateway's range (supervisor.mcs_range,
# default c768.c1023). libvirt picks each virtual machine's pair from the
# category range of its own daemon process, so narrowing the daemon's
# range is enough. Install as
#   /etc/systemd/system/virtqemud.service.d/mcs.conf
# then: systemctl daemon-reload; systemctl restart virtqemud.service
# Running machines keep their pairs until they are restarted.
#
# Check the daemon's type first ("ps -eZ | grep virtqemud"; this file assumes
# virtqemud_t) and adjust the range if you changed mcs_range.
[Service]
SELinuxContext=system_u:system_r:virtqemud_t:s0-s0:c0.c767
