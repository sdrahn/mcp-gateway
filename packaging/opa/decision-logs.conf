# mcp-opa.service drop-in: ship OPA's decision logs to a collector, in
# addition to the journal. Works with every policy mode (directories,
# signed bundle file, bundle server). Install as
#   /etc/systemd/system/mcp-opa.service.d/decision-logs.conf
# with the OPA configuration at /etc/mcp-gateway/opa-config.yaml (see
# decision-logs.yaml.example next to this file; with a bundle server, add
# the decision_logs part to that server's configuration instead), allow
# OPA to reach the network in SELinux:
#   setsebool -P mcpopa_can_network on
# then: systemctl daemon-reload; systemctl restart mcp-opa.service
#
# The collector receives what the journal gets: tool arguments masked by
# data.mcp.log.mask, and input.context.decision_id linking each decision to
# the gateway's audit record.
[Service]
Environment=OPA_EXTRA_ARGS=--config-file=/etc/mcp-gateway/opa-config.yaml
PrivateNetwork=no
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
