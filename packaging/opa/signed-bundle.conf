# mcp-opa.service drop-in: load the policy from a signed bundle instead of
# the policy directories. Install as
#   /etc/systemd/system/mcp-opa.service.d/policy.conf
# with the verification key (public, PEM) at
# /etc/mcp-gateway/bundle/verify.pem ("mcp-policy-bundle -G" creates a key
# pair on this host), build the bundle with mcp-policy-bundle, then:
# systemctl daemon-reload; systemctl restart mcp-opa.service
#
# OPA verifies the signature when it starts and refuses to start with an
# unsigned or tampered bundle, in which case the gateway denies all
# requests. New revisions take effect on restart (mcp-policy-bundle does
# that). Do not add --watch: OPA does not verify signatures when --watch
# reloads a bundle.
[Service]
ExecStart=
ExecStart=/usr/bin/opa run --server \
    --addr unix:///run/mcp-gateway/opa.sock \
    --unix-socket-perm 0660 \
    --log-format json \
    --set=decision_logs.console=true \
    --bundle \
    --verification-key /etc/mcp-gateway/bundle/verify.pem \
    --signing-alg RS256 \
    /etc/mcp-gateway/bundle/policy.tar.gz
