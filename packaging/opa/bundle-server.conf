# mcp-opa.service drop-in: fetch signed policy bundles from a bundle
# server. Install as
#   /etc/systemd/system/mcp-opa.service.d/policy.conf
# with the OPA configuration at /etc/mcp-gateway/opa-config.yaml (see
# opa-config.yaml.example next to this file), allow OPA to reach the
# network in SELinux:
#   setsebool -P mcpopa_can_network on
# then: systemctl daemon-reload; systemctl restart mcp-opa.service
#
# OPA reports each bundle it activates to the gateway (status in the
# example configuration) when the gateway listens for it:
#   mcp-gateway-admin config set policy.status_listen 127.0.0.1:9465
#   semanage port -a -t mcp_opa_status_port_t -p tcp 9465
#   systemctl restart mcp-gateway.service
# Without it the gateway notices a new bundle within policy.watch_interval.
#
# OPA verifies every bundle it downloads and keeps the active revision if
# a download is unsigned or does not verify. Until the first bundle is
# activated, the gateway denies all requests.
[Service]
ExecStart=
ExecStart=/usr/bin/opa run --server \
    --addr unix:///run/mcp-gateway/opa.sock \
    --unix-socket-perm 0660 \
    --log-format json \
    --set=decision_logs.mask_decision=/mcp/log/mask \
    $OPA_EXTRA_ARGS \
    --config-file /etc/mcp-gateway/opa-config.yaml
PrivateNetwork=no
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
