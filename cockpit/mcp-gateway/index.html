<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>MCP Gateway approvals</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="approvals.css">
    <script src="../base1/cockpit.js"></script>
    <script src="approvals.js" defer></script>
</head>
<body>
    <header>
        <h1>MCP Gateway</h1>
        <span id="whoami" class="muted"></span>
    </header>
    <div id="error" class="error" hidden></div>
    <main>
        <section>
            <h2>Pending approvals</h2>
            <p class="muted">Requests from AI agents that need a human decision. Only
            approve what you expect: the agent cannot see or influence this page.</p>
            <div id="approvals"></div>
        </section>
        <section>
            <h2>Grants</h2>
            <p class="muted">Standing approvals. Revoking one makes the next call ask again.</p>
            <table id="grants">
                <thead>
                    <tr><th>Call</th><th>Principal</th><th>Scope</th><th>Expires</th>
                        <th>Approved by</th><th></th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
    </main>
</body>
</html>
