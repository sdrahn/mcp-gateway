# The kind test (run.sh): deploy/kubernetes with the image under test, a
# server that speaks HTTP in the cluster (echo), the cluster's
# ServiceAccount tokens as the only issuer, a stdio server (echo -stdio)
# in pods of its own with the Kubernetes launcher, and role data that
# lets the ServiceAccounts agents/custos and agents/other call them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../deploy/kubernetes
  - echo.yaml
# The shared store (config.yaml, replication): one replica on it.
components:
  - ../../deploy/kubernetes/replication
images:
  - name: mcp-gateway
    newName: mcp-gateway
    newTag: test
patches:
  - path: config.yaml
