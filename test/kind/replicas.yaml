# Three replicas on the shared store (roadmap step 49): no volume (the
# store keeps the state), the replicas' certificate from the Secret
# run.sh makes, and the peer listener's port; a rolling update, one new
# pod before an old one drains, spread over the nodes (as the chart does
# with replication.replicas > 1; pdb.yaml with it).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gateway
  namespace: mcp-gateway
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: mcp-gateway, app.kubernetes.io/component: gateway}
      # A replica drains for replication.drain_timeout (30 s) before it
      # stops: 15 s more for the stop itself.
      terminationGracePeriodSeconds: 45
      containers:
        - name: gateway
          ports:
            - {name: peer, containerPort: 8444}
          volumeMounts:
            - {name: peer, mountPath: /etc/mcp-gateway/peer, readOnly: true}
      volumes:
        - name: state
          persistentVolumeClaim: null
          emptyDir: {}
        - name: peer
          secret: {secretName: mcp-gateway-peer, defaultMode: 0440}
