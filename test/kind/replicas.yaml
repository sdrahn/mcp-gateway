# Three replicas on the shared store (roadmap step 49 stage B): no
# volume (the store keeps the state), the replicas' certificate from the
# Secret run.sh makes, and the peer listener's port.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gateway
  namespace: mcp-gateway
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: gateway
          ports:
            - {name: peer, containerPort: 8444}
          volumeMounts:
            - {name: peer, mountPath: /etc/mcp-gateway/peer, readOnly: true}
      volumes:
        - name: state
          persistentVolumeClaim: null
          emptyDir: {}
        - name: peer
          secret: {secretName: mcp-gateway-peer, defaultMode: 0440}
