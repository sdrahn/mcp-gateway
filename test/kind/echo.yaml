apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-echo
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/component: echo}
  template:
    metadata:
      labels: {app.kubernetes.io/component: echo}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: echo
          image: mcp-echo:test
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-echo
spec:
  selector: {app.kubernetes.io/component: echo}
  ports: [{name: http, port: 8080, targetPort: http}]
