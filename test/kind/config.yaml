apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-gateway-config
  namespace: mcp-gateway
data:
  gateway.yaml: |
    version: 1
    deployment: container
    servers_dir: /etc/mcp-gateway/servers.d
    state_dir: /var/lib/mcp-gateway
    policy:
      opa_socket: /run/mcp-gateway/opa.sock
      watch_interval: 2s
    metrics:
      listen: ":9464"
    # The shared store, in the gateway's namespace (the component's Role).
    replication:
      store: kubernetes
      namespace: mcp-gateway
      # Three replicas (replicas.yaml) forward to each other.
      listen: ":8444"
      peer_cert_file: /etc/mcp-gateway/peer/tls.crt
      peer_key_file: /etc/mcp-gateway/peer/tls.key
      peer_ca_file: /etc/mcp-gateway/peer/ca.crt
    # The labelled Services of mcp-servers are servers too (the
    # discovery component's Role there).
    server_discovery:
      namespaces:
        - namespace: mcp-servers
    supervisor:
      # An instance no session uses stops soon: the test sees its pod go.
      idle_timeout: 20s
      mode: kubernetes
      kubernetes:
        namespace: mcp-instances
        bridge_image: mcp-gateway:test
        gateway_namespace: mcp-gateway
        gateway_labels: {app.kubernetes.io/name: mcp-gateway, app.kubernetes.io/component: gateway}
    http:
      listen: ":8443"
      cert_file: /etc/mcp-gateway/tls/tls.crt
      key_file: /etc/mcp-gateway/tls/tls.key
      # Reached through kubectl port-forward in the test.
      audience: https://127.0.0.1:8443/mcp
      issuers:
        - issuer: https://kubernetes.default.svc.cluster.local
          audience: mcp-gateway
          ca_file: /etc/mcp-gateway/cluster-ca/ca.crt
          # The key set from the API server itself, with the pod's own
          # token (the discovery document names the node's address).
          jwks_url: https://kubernetes.default.svc.cluster.local/openid/v1/jwks
          token_file: /var/run/secrets/mcp-gateway/token/token
          scopes: []
          subject_prefix: "k8s:"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-gateway-servers
  namespace: mcp-gateway
data:
  echo.yaml: |
    name: echo
    url: http://mcp-echo.mcp-gateway.svc:8080/mcp
  stdio.yaml: |
    name: stdio
    command: [/usr/bin/echo-server, -stdio]
    image: mcp-echo:test
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-gateway-rbac
  namespace: mcp-gateway
data:
  data.yaml: |
    version: 1
    roles:
      echoer:
        permissions:
          - {server: echo, tool: echo}
          - {server: echo2, tool: echo}
          - {server: stdio, tool: '*'}
          # Servers discovered in mcp-servers (run.sh): one named, the others
          # under a glob without discovered: true, which does not reach them.
          - {server: mcp-servers-tickets, tool: echo}
          - {server: 'mcp-servers-*', tool: '*'}
    bindings:
      users:
        "k8s:system:serviceaccount:agents:custos": [echoer]
        "k8s:system:serviceaccount:agents:other": [echoer]
      groups: {}
    # The gateway's own account (uid 10001, no name in its image), as
    # kubectl exec reaches the control socket: it manages the instances.
    approvers:
      default: ["user:10001"]
