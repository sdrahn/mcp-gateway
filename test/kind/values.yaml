# The kind test with the Helm chart (run.sh, DEPLOY=helm): as the
# kustomize overlay (config.yaml), the cluster's ServiceAccount tokens as
# the only issuer.
image:
  repository: mcp-gateway
  tag: test
config:
  policy:
    watch_interval: 2s
  supervisor:
    # An instance no session uses stops soon: the test sees its pod go.
    idle_timeout: 20s
  http:
    # The cluster's ServiceAccount tokens only: no other identity
    # provider, none of its scopes (null removes the chart's defaults).
    issuer: null
    scopes: null
    # Reached through kubectl port-forward in the test.
    audience: https://127.0.0.1:8443/mcp
# Three replicas on the shared store, with the replicas' certificate
# run.sh makes, and no volume.
replication:
  enabled: true
  replicas: 3
  peerSecret: mcp-gateway-peer
persistence:
  enabled: false
# The labelled Services of mcp-servers are servers too.
serverDiscovery:
  namespaces:
    - namespace: mcp-servers
servers:
  echo:
    name: echo
    url: http://mcp-echo.mcp-gateway.svc:8080/mcp
  stdio:
    name: stdio
    command: [/usr/bin/echo-server, -stdio]
    image: mcp-echo:test
# A Secret run.sh creates, checked as the gateway's account reads it.
secrets:
  - name: mcp-gateway-kind
rbac:
  version: 1
  roles:
    echoer:
      permissions:
        - {server: echo, tool: echo}
        - {server: echo2, tool: echo}
        - {server: stdio, tool: '*'}
        # Servers discovered in mcp-servers (run.sh): one named, the others
        # under a glob without discovered: true, which does not reach them.
        - {server: mcp-servers-tickets, tool: echo}
        - {server: 'mcp-servers-*', tool: '*'}
  bindings:
    users:
      "k8s:system:serviceaccount:agents:custos": [echoer]
      "k8s:system:serviceaccount:agents:other": [echoer]
    groups: {}
  # The gateway's own account (uid 10001, no name in its image), as
  # kubectl exec reaches the control socket: it manages the instances.
  approvers:
    default: ["user:10001"]
