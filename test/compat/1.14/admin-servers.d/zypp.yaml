# mcp-server-zypp as a privileged server: it can install and remove
# packages (confirm_install, confirm_remove; role zypp-installer, every
# call approved). Enable it by linking it as
# /etc/mcp-gateway/servers.d/zypp.yaml (privileged servers are accepted
# only there); see chapter 13 of the user guide. With a btrfs root,
# install snapper-zypp-plugin: a pre and a post snapshot around every
# installation, so that one cut off halfway can be undone.
version: 1
name: zypp
command: ["/usr/bin/mcp-server-zypp"]
run_as: root
network: true
selinux_type: mcpsrv_zypp_t
privileged: true
# No landlock: installing packages writes wherever they put files.
