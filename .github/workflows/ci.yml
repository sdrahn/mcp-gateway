name: CI

on:
  push:
    branches: [main, "release-*"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # For the end-to-end test in e2e/.
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: make build
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - run: opa fmt --fail --list policy
      - run: opa check --strict policy
      - run: opa test policy -v
      # Regal, the Rego linter (configuration: .regal/config.yaml). Pinned,
      # so that new rules arrive with a deliberate update.
      - name: regal lint
        env:
          REGAL_VERSION: v0.42.0
          REGAL_SHA256: 2ebd3c93e4b325b735dbc4851a033e4d7830e88a79c47c8d087ea75c061cec67
        run: |
          curl -fsSL -o "$RUNNER_TEMP/regal" \
            "https://github.com/open-policy-agent/regal/releases/download/$REGAL_VERSION/regal_Linux_x86_64"
          echo "$REGAL_SHA256  $RUNNER_TEMP/regal" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/regal"
          "$RUNNER_TEMP/regal" lint --format github policy

  selinux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y selinux-policy-dev checkpolicy
      - run: make selinux

  # The Cockpit pages in headless Chrome (preinstalled on the runner),
  # against a stub of cockpit.js.
  cockpit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: for f in cockpit/mcp-gateway/*.js; do node --check "$f"; done
      - run: npm install --no-save --no-package-lock playwright-core@1
      - run: node cockpit/test/smoke.js
        env:
          CHROME: /usr/bin/google-chrome

  # The OBS package (packaging/suse), built the way OBS builds it: real
  # SUSE rpm macros, offline Go modules, the SELinux module against
  # openSUSE's policy, rpmlint with the package's rpmlintrc.
  # On each distribution the VM test runs (packages built for it).
  opensuse:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: tumbleweed
            image: registry.opensuse.org/opensuse/tumbleweed:latest
          - distro: leap16
            image: registry.opensuse.org/opensuse/leap:16.0
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      # The packages providing rpm macros the spec uses must be there before
      # rpmspec can parse it (OBS knows them from its project config).
      - name: Install tools and rpm macro packages
        run: >
          zypper -n --gpg-auto-import-keys in --no-recommends
          git tar gzip rpm-build rpmlint
          sysuser-tools systemd-rpm-macros selinux-policy-devel
      - uses: actions/checkout@v4
      - name: Install build dependencies (from the spec, as OBS does)
        run: |
          rpmspec -q --buildrequires packaging/suse/mcp-gateway.spec | tee /tmp/buildrequires
          xargs -d '\n' zypper -n --gpg-auto-import-keys in --no-recommends </tmp/buildrequires
      - name: Prepare sources (tarball and vendor.tar.gz, as the OBS services do)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(rpmspec -q --srpm --qf '%{version}' packaging/suse/mcp-gateway.spec)
          mkdir -p ~/rpmbuild/SOURCES
          git archive --prefix="mcp-gateway-$version/" -o ~/rpmbuild/SOURCES/mcp-gateway-$version.tar.gz HEAD
          go mod vendor
          tar czf ~/rpmbuild/SOURCES/vendor.tar.gz vendor
          rm -rf vendor
          cp packaging/suse/mcp-gateway-rpmlintrc ~/rpmbuild/SOURCES/
      - name: rpmbuild
        # openSUSE's default topdir is /usr/src/packages.
        run: rpmbuild -ba --define "_topdir $HOME/rpmbuild" packaging/suse/mcp-gateway.spec
      - name: rpmlint
        # On OBS the .changes file provides the changelog; here it is empty.
        run: |
          { cat packaging/suse/mcp-gateway-rpmlintrc; echo 'addFilter("no-changelogname-tag")'; } >/tmp/rpmlintrc
          rpmlint -r /tmp/rpmlintrc ~/rpmbuild/RPMS/*/*.rpm
      - name: Install and smoke-test
        run: |
          # opa is a runtime dependency only; not needed for this test.
          rpm -ivh --nodeps ~/rpmbuild/RPMS/x86_64/mcp-gateway-[0-9]*.rpm ~/rpmbuild/RPMS/x86_64/mcp-gateway-demo-server-*.rpm
          getent passwd mcp-gateway mcp-opa
          getent group mcp-users
          mcp-gateway --version
          mcp-gateway --check 2>&1 | tee /tmp/check.log
          grep -q 'config=/usr/etc/mcp-gateway/gateway.yaml' /tmp/check.log
          grep -q 'backends=1' /tmp/check.log
          test -f /usr/share/mcp-gateway/policy/mcp/approvals.rego
          test -f /usr/share/mcp-gateway/policy/mcp/log.rego
          test -f /usr/share/mcp-gateway/schema/rbac.schema.json
          mcp-gateway --check-policy-data
          test -x /usr/sbin/mcp-policy-bundle
          test -f /usr/share/mcp-gateway/opa/signed-bundle.conf
          test -f /usr/share/mcp-gateway/opa/decision-logs.conf
          test -f /usr/share/mcp-gateway/mcs/virtqemud.conf
          test "$(stat -c %a /etc/mcp-gateway/credentials)" = 700
      - name: Install and smoke-test the server setups
        run: |
          rpm -ivh --nodeps ~/rpmbuild/RPMS/noarch/mcp-gateway-profile-*.rpm
          getent passwd mcp-sysmgmt
          id -nG mcp-sysmgmt | grep -qw systemd-journal
          mcp-gateway --check 2>&1 | tee /tmp/check.log
          grep -q 'backends=5' /tmp/check.log
          test -f /usr/share/polkit-1/rules.d/60-mcp-gateway-systemd.rules
          test -f /usr/share/mcp-gateway/profiles/zypp-privileged.yaml
          # Bindings may name the roles the setups ship.
          echo '{"roles": {}, "bindings": {"users": {"root": ["systemd-operator", "zypp-reader"]}}}' |
            mcp-gateway --check-policy-data --policy-data -
      - name: Install the SELinux module
        run: |
          zypper -n --gpg-auto-import-keys in --allow-unsigned-rpm ~/rpmbuild/RPMS/noarch/mcp-gateway-selinux-*.rpm
          semodule -l | grep -x mcp_gateway
          for m in systemd firewalld zypp suseconnect; do semodule -l | grep -x "mcp_$m"; done
      - name: Collect the packages for the VM test
        run: mkdir rpms && cp ~/rpmbuild/RPMS/*/*.rpm rpms/
      - uses: actions/upload-artifact@v4
        with:
          name: rpms-${{ matrix.distro }}
          path: rpms/
          retention-days: 7

  # The MCP servers the setup packages are for, from their upstream sources
  # at pinned versions (test/vm/build-servers.sh), for the VM test.
  servers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: tumbleweed
            image: registry.opensuse.org/opensuse/tumbleweed:latest
          - distro: leap16
            image: registry.opensuse.org/opensuse/leap:16.0
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - name: Install build tools
        run: >
          zypper -n --gpg-auto-import-keys in --no-recommends
          git tar gzip make gcc gcc-c++ cmake systemd-devel
          libzypp-devel yaml-cpp-devel libboost_test-devel
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Build the servers
        run: test/vm/build-servers.sh servers
      - uses: actions/upload-artifact@v4
        with:
          name: servers-${{ matrix.distro }}
          path: servers/
          retention-days: 7

  # The packages installed on a real openSUSE system (a KVM guest) with
  # SELinux enforcing: domains, MCS pairs, polkit, credentials, kernel
  # audit, and no SELinux denials (test/vm).
  vm:
    needs: [opensuse, servers]
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: tumbleweed
            name: openSUSE Tumbleweed
            image_url: https://download.opensuse.org/tumbleweed/appliances/openSUSE-Tumbleweed-Minimal-VM.x86_64-Cloud.qcow2
          - distro: leap16
            name: openSUSE Leap 16.0
            image_url: https://download.opensuse.org/distribution/leap/16.0/appliances/Leap-16.0-Minimal-VM.x86_64-Cloud.qcow2
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
          static: true
      - uses: actions/download-artifact@v4
        with:
          name: rpms-${{ matrix.distro }}
          path: rpms
      - uses: actions/download-artifact@v4
        with:
          name: servers-${{ matrix.distro }}
          path: servers
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
      - name: Build the test client and the privileged test server
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/mcpcall" ./test/vm/mcpcall
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/privsrv" ./test/vm/privsrv
      - name: Run the VM tests (${{ matrix.name }})
        env:
          WORK: ${{ runner.temp }}/vm
          IMAGE_URL: ${{ matrix.image_url }}
        run: test/vm/run-vm.sh rpms "$RUNNER_TEMP/mcpcall" "$(command -v opa)" "$RUNNER_TEMP/privsrv" servers
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-logs-${{ matrix.distro }}
          path: |
            ${{ runner.temp }}/vm/console.log
            ${{ runner.temp }}/vm/test.log
          if-no-files-found: ignore
